[package]
name = "wgtun"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "Plan and safely provision RouterOS WireGuard hub-and-site tunnels"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
url = "2.5"

sha2 = "0.10"
chrono = "0.4"
base64 = "0.22"


